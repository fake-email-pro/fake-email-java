name: Release

# Published through JitPack (https://jitpack.io): it builds the tag itself (jitpack.yml) and serves the jars as
# pro.fake-email:fake-email-java:<tag>. This workflow checks the tag, runs the tests, asks JitPack to build the
# tag and waits for it, then creates the GitHub Release with the jars. No secrets.
# The `release` profile in pom.xml still signs and deploys to Maven Central, should the SDK move there.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Tag matches the pom.xml version
        run: |
          version="$(./mvnw -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the pom.xml version ${version} (expected v${version})"
            exit 1
          fi

  test:
    needs: check-tag
    name: Test on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw -B -ntp verify
      - run: ./mvnw -B -ntp spotless:check
        if: matrix.java == 25

  jitpack:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: jitpack
      url: https://jitpack.io/#fake-email-pro/fake-email-java/${{ github.ref_name }}
    steps:
      # Requesting the pom starts the build on JitPack; it answers 200 once the jars are there. The build log
      # is at https://jitpack.io/com/github/fake-email-pro/fake-email-java/<tag>/build.log.
      - name: Build on JitPack
        run: |
          base="https://jitpack.io/com/github/fake-email-pro/fake-email-java/${GITHUB_REF_NAME}"
          pom="${base}/fake-email-java-${GITHUB_REF_NAME}.pom"
          for i in $(seq 1 40); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$pom")"
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "::error::JitPack did not publish ${GITHUB_REF_NAME}; see ${base}/build.log"
          curl -s "${base}/build.log" | tail -50
          exit 1

  github-release:
    needs: jitpack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build the jars
        run: ./mvnw -B -ntp -DskipTests -Dgpg.skip -P release package
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The release notes are this version's section of CHANGELOG.md.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          gh release create "$GITHUB_REF_NAME" target/*.jar --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
